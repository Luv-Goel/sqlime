name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Run a quick check
      run: |
        sqlime --version
        python -c "import sqlime; print('import ok')"
    - name: Create test DB and verify commands
      run: |
        python -c "
        import sqlite3, os
        conn = sqlite3.connect('/tmp/test.db')
        conn.execute('CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT, val REAL)')
        conn.execute(\"INSERT INTO t VALUES (1, 'alice', 1.0)\")
        conn.execute(\"INSERT INTO t VALUES (2, 'bob', 2.0)\")
        conn.execute('DELETE FROM t WHERE id = 1')
        conn.commit()
        conn.close()
        "
        sqlime inspect /tmp/test.db
        sqlime schema /tmp/test.db
        sqlime check /tmp/test.db
        sqlime export /tmp/test.db --format json -o /tmp/test_export
        sqlime report /tmp/test.db -o /tmp/test_report.html
        echo "ALL COMMANDS PASSED"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      run: pip install ruff
    - name: Lint
      run: ruff check sqlime/ --ignore=E501
