[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sqlime"
version = "0.1.0"
description = "SQLite forensic inspection and recovery toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
sqlime = "sqlime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqlime*"]
